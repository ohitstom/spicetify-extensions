<!doctype html>
<meta charset="utf-8">
<title>Spotify Backup regression tests</title>
<pre id="results">Running…</pre>
<script type="module">
	// Serve the repository with `python3 -m http.server 8765`, then open this page.
	// Uses a disposable browser origin: these tests clear its localStorage and Marketplace database.
	const source = await (await fetch("spotifyBackup.js", { cache: "no-store" })).text();
	const testSource = source.slice(0, source.indexOf("\t// Hotload useEffect")) +
		"return { backupData, restoreData, startupCheck }; })();";
	const load = new Function("Spicetify", "window", "fetch", testSource.replace("(async function spotifyBackup()", "return (async function spotifyBackup()"));
	const databaseName = "spicetify-marketplace";
	const key = "marketplace:installed-extensions";
	const inventory = { [key]: '["marketplace:installed:test/example.js"]', "marketplace:installed:test/example.js": '{"extensionURL":"example.js"}' };
	const results = [];
	function assert(condition, message) { if (!condition) throw new Error(message); }
	function requestResult(request) {
		return new Promise((resolve, reject) => {
			request.onsuccess = () => resolve(request.result);
			request.onerror = () => reject(request.error);
		});
	}
	async function seed(records = {}) {
		// Dexie version 2 is native IndexedDB version 20.
		const request = indexedDB.open(databaseName, 20);
		request.onupgradeneeded = () => request.result.createObjectStore("settings", { keyPath: "key" });
		const db = await requestResult(request);
		await new Promise((resolve, reject) => {
			const transaction = db.transaction("settings", "readwrite");
			for (const [key, value] of Object.entries(records)) transaction.objectStore("settings").put({ key, value });
			transaction.oncomplete = resolve;
			transaction.onabort = () => reject(transaction.error);
		});
		db.close();
	}
	async function readDatabase() {
		const db = await requestResult(indexedDB.open(databaseName));
		const rows = await requestResult(db.transaction("settings").objectStore("settings").getAll());
		db.close();
		return Object.fromEntries(rows.map(row => [row.key, row.value]));
	}
	async function setup({ settings = {}, marketplace, config = {}, clipboard = "{}", remote = {}, lastUpdate = "2026-10-20T00:00:00Z", database = indexedDB } = {}) {
		localStorage.setItem("spotifyBackup:settings", JSON.stringify(settings));
		const state = { notifications: [], patches: [], copies: [], reloads: 0 };
		const windowStub = { Marketplace: marketplace, indexedDB: database, location: { reload: () => state.reloads++ } };
		const spicetify = {
			Config: config, React: { memo: fn => fn }, ReactDOM: {}, Locale: { _dictionary: {} },
			Platform: { History: {}, ClipboardAPI: { copy: async value => state.copies.push(JSON.parse(value)), paste: async () => clipboard } },
			showNotification: (message, error) => state.notifications.push({ message, error })
		};
		const fetchStub = async (url, options = {}) => {
			if (options.method === "PATCH") state.patches.push(JSON.parse(JSON.parse(options.body).files["spotify-backup.json"].content));
			return { ok: true, json: async () => ({ updated_at: lastUpdate, files: { "spotify-backup.json": { content: JSON.stringify(remote) } } }) };
		};
		return { ...state, state, windowStub, api: await load(spicetify, windowStub, fetchStub) };
	}
	async function test(name, run) {
		localStorage.clear();
		await requestResult(indexedDB.deleteDatabase(databaseName));
		try { await run(); results.push(`PASS ${name}`); }
		catch (error) { results.push(`FAIL ${name}: ${error.message}`); }
		document.querySelector("pre").textContent = results.join("\n");
	}
	await test("backs up Marketplace's current export, not stale localStorage keys", async () => {
		const { api, state } = await setup({ marketplace: { export: () => inventory }, settings: { gistToken: "test-only-token" } });
		localStorage.setItem("ordinary-setting", "unchanged");
		localStorage.setItem(key, "[]");
		localStorage.setItem("marketplace:deleted", "stale");
		await api.backupData();
		assert(state.copies[0][key] === inventory[key], "IndexedDB-backed inventory omitted");
		assert(!("marketplace:deleted" in state.copies[0]), "deleted Marketplace data resurrected");
		assert(state.copies[0]["ordinary-setting"] === "unchanged", "ordinary setting lost");
		assert(!JSON.parse(state.copies[0]["spotifyBackup:settings"]).gistToken, "token exported");
	});
	await test("legacy Marketplace export overrides an obsolete IndexedDB database", async () => {
		await seed({ [key]: "obsolete" });
		const { api, state } = await setup({ marketplace: { export: () => inventory } });
		await api.backupData();
		assert(state.copies[0][key] === inventory[key], "obsolete database won");
	});
	await test("waits for configured Marketplace hydration before backup", async () => {
		const { api, state, windowStub } = await setup({ config: { custom_apps: ["marketplace"] } });
		setTimeout(() => { windowStub.Marketplace = { export: () => inventory }; }, 100);
		await api.backupData();
		assert(state.copies[0][key] === inventory[key], "backup ran before hydration");
	});
	await test("legacy localStorage backup needs no Marketplace or database", async () => {
		const { api, state } = await setup();
		localStorage.setItem(key, inventory[key]);
		await api.backupData();
		assert(state.copies[0][key] === inventory[key], "legacy data omitted");
		assert(!(await indexedDB.databases()).some(db => db.name === databaseName), "backup created a database");
	});
	await test("failed Marketplace export does not overwrite the Gist", async () => {
		const { api, state } = await setup({ settings: { gistEnabled: true }, marketplace: { export: () => { throw new Error("storage unreadable"); } } });
		await api.backupData();
		assert(state.patches.length === 0, "incomplete backup uploaded");
		assert(state.notifications.some(item => item.error), "failure not reported");
	});
	await test("restores historical flat backups to both stores before reloading", async () => {
		await seed({ [key]: "old", "marketplace:removed": "old", "internal:local-storage-migrated": "1", "unrelated": "keep" });
		const backup = { ...inventory, "ordinary-setting": "restored", "spotifyBackup:settings": JSON.stringify({ backupInterval: "daily" }) };
		const { api, state } = await setup({ settings: { gistToken: "test-only-token", backupInterval: "off" }, clipboard: JSON.stringify(backup) });
		await api.restoreData();
		const data = await readDatabase();
		assert(data[key] === inventory[key] && localStorage.getItem(key) === inventory[key], "stores disagree");
		assert(!("marketplace:removed" in data), "old records survived replacement");
		assert(data["internal:local-storage-migrated"] === "1" && data.unrelated === "keep", "metadata changed");
		const settings = JSON.parse(localStorage.getItem("spotifyBackup:settings"));
		assert(settings.gistToken === "test-only-token" && settings.backupInterval === "off", "device-local settings overwritten");
		assert(state.reloads === 1, "restore did not finish");
	});
	await test("modern restore does not duplicate database records into localStorage", async () => {
		const original = { [key]: "[]" };
		await seed({ ...original, "internal:local-storage-migrated": "1" });
		const { api, state } = await setup({ marketplace: { version: "1.0.11", export: () => original }, clipboard: JSON.stringify(inventory) });
		await api.restoreData();
		assert((await readDatabase())[key] === inventory[key], "modern inventory not restored");
		assert(localStorage.getItem(key) === null, "modern records unnecessarily duplicated");
		assert(state.reloads === 1, "idle restore failed");
	});
	await test("pending modern persistence aborts restore without changing either store", async () => {
		await seed({ [key]: "old durable value" });
		const { api, state } = await setup({ marketplace: { version: "1.0.11", export: () => ({ [key]: "pending value" }) }, clipboard: JSON.stringify(inventory) });
		localStorage.setItem("ordinary-setting", "original");
		await api.restoreData();
		assert((await readDatabase())[key] === "old durable value", "pending persistence was overwritten");
		assert(localStorage.getItem("ordinary-setting") === "original", "local settings changed");
		assert(state.reloads === 0 && state.notifications.some(item => item.error), "unsafe restore reported success");
	});
	await test("modern cache changing during restore aborts the transaction", async () => {
		await seed({ [key]: "original" });
		let reads = 0;
		const { api, state } = await setup({ marketplace: { version: "1.0.11", export: () => ({ [key]: ++reads === 1 ? "original" : "changed" }) }, clipboard: JSON.stringify(inventory) });
		await api.restoreData();
		assert((await readDatabase())[key] === "original" && state.reloads === 0, "concurrent cache change ignored");
	});
	await test("modern localStorage fallback can restore while idle", async () => {
		await seed({});
		localStorage.setItem(key, "[]");
		const { api, state } = await setup({ marketplace: { version: "1.0.11", export: () => ({ [key]: "[]" }) }, clipboard: JSON.stringify(inventory) });
		await api.restoreData();
		assert(state.reloads === 1 && localStorage.getItem(key) === inventory[key], "fallback restore failed");
		assert((await readDatabase())[key] === inventory[key], "future migration would read stale inventory");
	});
	await test("new empty snapshots explicitly clear existing Marketplace records", async () => {
		const empty = await setup({ marketplace: { export: () => ({}) } });
		await empty.api.backupData();
		await seed(inventory);
		const { api, state } = await setup({ clipboard: JSON.stringify(empty.state.copies[0]) });
		await api.restoreData();
		const restored = await readDatabase();
		assert(restored[key] === "[]" && !("marketplace:installed:test/example.js" in restored), "empty inventory did not clear installations");
		assert(state.reloads === 1, "empty restore failed");
	});
	await test("ordinary historical restore does not wait for uninitialized Marketplace", async () => {
		const { api, state } = await setup({ config: { custom_apps: ["marketplace"] }, clipboard: '{"ordinary-setting":"recovered"}' });
		await api.restoreData();
		assert(state.reloads === 1 && localStorage.getItem("ordinary-setting") === "recovered", "ordinary recovery blocked");
	});
	await test("legacy restore does not create a Marketplace database", async () => {
		const { api, state } = await setup({ clipboard: JSON.stringify(inventory) });
		await api.restoreData();
		assert(localStorage.getItem(key) === inventory[key] && state.reloads === 1, "legacy restore failed");
		assert(!(await indexedDB.databases()).some(db => db.name === databaseName), "restore created a database");
	});
	await test("unavailable IndexedDB leaves local settings untouched and does not reload", async () => {
		const { api, state } = await setup({ clipboard: JSON.stringify(inventory), database: { open: () => { throw new Error("unavailable"); } } });
		localStorage.setItem("ordinary-setting", "original");
		await api.restoreData();
		assert(localStorage.getItem("ordinary-setting") === "original", "local settings cleared after database failure");
		assert(state.reloads === 0 && state.notifications.some(item => item.error), "restore reported success");
	});
	await test("invalid backups are rejected before either store is changed", async () => {
		await seed(inventory);
		const { api, state } = await setup({ clipboard: '{"marketplace:installed-extensions":[]}' });
		localStorage.setItem("ordinary-setting", "original");
		await api.restoreData();
		assert(localStorage.getItem("ordinary-setting") === "original", "invalid backup cleared localStorage");
		assert((await readDatabase())[key] === inventory[key] && state.reloads === 0, "invalid backup modified database");
	});
	await test("an aborted database transaction rolls back without clearing localStorage", async () => {
		await seed({ [key]: "original" });
		const { api, state } = await setup({ clipboard: JSON.stringify(inventory) });
		localStorage.setItem("ordinary-setting", "original");
		const put = IDBObjectStore.prototype.put;
		let aborted = false;
		IDBObjectStore.prototype.put = function () {
			if (!aborted) { aborted = true; this.transaction.abort(); }
		};
		try { await api.restoreData(); }
		finally { IDBObjectStore.prototype.put = put; }
		assert((await readDatabase())[key] === "original", "aborted transaction lost old records");
		assert(localStorage.getItem("ordinary-setting") === "original" && state.reloads === 0, "continued after transaction failure");
	});
	await test("historical backups without Marketplace keys leave its database untouched", async () => {
		await seed({ ...inventory, "internal:local-storage-migrated": "1" });
		const { api, state } = await setup({ clipboard: '{"ordinary-setting":"restored"}' });
		await api.restoreData();
		const data = await readDatabase();
		assert(data[key] === inventory[key] && data["internal:local-storage-migrated"] === "1", "historical backup erased Marketplace data");
		assert((await indexedDB.databases()).find(db => db.name === databaseName).version === 20, "database upgraded");
		assert(state.reloads === 1, "restore failed");
	});
	await test("preserves the token when the restored timestamp already matches the Gist", async () => {
		const timestamp = "2026-10-20T00:00:00Z";
		const remote = { ...inventory, "spotifyBackup:settings": JSON.stringify({ lastBackupTimestamp: timestamp }) };
		const { api } = await setup({ settings: { gistEnabled: true, gistToken: "test-only-token" }, remote, lastUpdate: timestamp });
		await api.restoreData();
		assert(JSON.parse(localStorage.getItem("spotifyBackup:settings")).gistToken === "test-only-token", "token lost on unchanged timestamp");
	});
	await test("startup sync still restores a newer Gist", async () => {
		await seed({ [key]: "old" });
		const { api, state } = await setup({ settings: { gistEnabled: true, backupInterval: "startup", lastBackupTimestamp: "2026-10-19T00:00:00Z" }, remote: inventory });
		await api.startupCheck();
		assert((await readDatabase())[key] === inventory[key] && state.reloads === 1, "newer Gist not restored");
		assert(state.patches.length === 0, "newer Gist overwritten");
	});
	await test("daily sync backs up current Marketplace data when local timestamp is newer", async () => {
		const { api, state } = await setup({ settings: { gistEnabled: true, backupInterval: "daily", lastBackupTimestamp: "2020-01-02T00:00:00Z" }, lastUpdate: "2020-01-01T00:00:00Z", marketplace: { export: () => inventory } });
		await api.startupCheck();
		assert(state.patches[0][key] === inventory[key], "Marketplace missing from Gist sync");
		assert(state.reloads === 0, "older Gist restored");
	});
	await test("daily sync does nothing before its interval has elapsed", async () => {
		const { api, state } = await setup({ settings: { gistEnabled: true, backupInterval: "daily", lastBackupTimestamp: new Date().toISOString() } });
		await api.startupCheck();
		assert(state.patches.length === 0 && state.reloads === 0, "daily interval ignored");
	});
	await test("slow Marketplace startup does not time out or upload incomplete data", async () => {
		const { api, state, windowStub } = await setup({ settings: { gistEnabled: true }, config: { custom_apps: ["marketplace"] } });
		const pending = api.backupData();
		await new Promise(resolve => setTimeout(resolve, 11000));
		assert(state.patches.length === 0 && !state.notifications.some(item => item.error), "startup timed out or uploaded early");
		windowStub.Marketplace = { export: () => inventory };
		await pending;
		assert(state.patches[0][key] === inventory[key], "late Marketplace data omitted");
	});
	await test("localStorage write failure rolls back both stores", async () => {
		await seed({ [key]: "original" });
		const { api, state } = await setup({ clipboard: JSON.stringify({ ...inventory, "ordinary-setting": "restored" }) });
		localStorage.setItem("ordinary-setting", "original");
		const previous = JSON.stringify({ ...localStorage });
		const setItem = Storage.prototype.setItem;
		let failed = false;
		Storage.prototype.setItem = function (key, value) {
			if (!failed && value === "restored") {
				failed = true;
				throw new DOMException("Quota exceeded", "QuotaExceededError");
			}
			return setItem.call(this, key, value);
		};
		try { await api.restoreData(); }
		finally { Storage.prototype.setItem = setItem; }
		assert(JSON.stringify({ ...localStorage }) === previous, "original localStorage not recovered");
		assert((await readDatabase())[key] === "original", "database committed after localStorage failed");
		assert(state.reloads === 0 && state.notifications.some(item => item.error), "failed restore reported success");
	});
	await requestResult(indexedDB.deleteDatabase(databaseName));
	localStorage.clear();
	document.title = results.some(line => line.startsWith("FAIL")) ? "FAIL" : "PASS";
	document.querySelector("pre").textContent += `\n\n${results.filter(line => line.startsWith("PASS")).length}/${results.length} passed`;
</script>
